<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#162b3f" />
  <meta name="description" content="A little living pixel city, unfolding a day at a time." />
  <title>Little World Window</title>
  <style>
    :root { color-scheme: dark; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: #101d2b; color: #edf2db; display: grid; place-items: center; overflow-x: hidden; }
    .app { width: min(100vw, 1600px); padding: clamp(8px, 2vw, 28px); }
    .top { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; margin: 0 3px 14px; }
    .eyebrow { color: #efbd85; font-size: 11px; letter-spacing: .24em; text-transform: uppercase; }
    h1 { margin: 4px 0 0; font-size: clamp(18px, 2.2vw, 30px); font-weight: 600; letter-spacing: -.055em; }
    .clock { color: #afc5c6; font-size: 12px; white-space: nowrap; padding-bottom: 4px; }
    .frame { position: relative; overflow: hidden; border: 9px solid #7e5b42; border-bottom-color: #594333; border-right-color: #604938; box-shadow: 0 24px 70px #020a13b3, inset 0 0 0 2px #3b2b25; background: #426279; aspect-ratio: 16 / 9; }
    canvas { display: block; width: 100%; height: 100%; image-rendering: pixelated; }
    .scene-label { position: absolute; top: 12px; left: 13px; padding: 6px 9px; background: #142638bb; border: 1px solid #c9d9c04a; color: #f4ebcf; font-size: clamp(9px, 1vw, 12px); letter-spacing: .08em; pointer-events: none; }
    .story { display: flex; justify-content: space-between; align-items: flex-start; gap: 20px; padding: 17px 3px 5px; }
    .story-text { max-width: 720px; }
    .story-kicker { color: #e9ae81; font-size: 11px; text-transform: uppercase; letter-spacing: .19em; }
    .story-title { margin: 5px 0 6px; font-size: clamp(16px, 2vw, 22px); letter-spacing: -.03em; }
    .story p { margin: 0; color: #b7c7c5; line-height: 1.5; font-size: 12px; }
    .controls { display: flex; gap: 7px; flex-wrap: wrap; justify-content: flex-end; }
    button { color: #e6e9d7; background: #263b4a; border: 1px solid #466071; padding: 8px 10px; font: 11px ui-monospace, monospace; cursor: pointer; border-radius: 3px; }
    button:hover, button:focus-visible { background: #3b5968; outline: 2px solid #e9ae81; outline-offset: 2px; }
    .hint { color: #839b9f; font-size: 10px; letter-spacing: .03em; margin: 12px 3px 0; }
    @media (max-width: 720px) { .story { flex-direction: column; } .controls { justify-content: flex-start; } .frame { border-width: 5px; } .scene-label { top: 5px; left: 5px; } }
    @media (prefers-reduced-motion: reduce) { .hint::after { content: ' · Reduced motion enabled'; } }
  </style>
</head>
<body>
  <main class="app">
    <header class="top"><div><div class="eyebrow">A window into somewhere else</div><h1>Little World Window</h1></div><div class="clock" id="clock"></div></header>
    <div class="frame"><canvas id="world" width="640" height="360" aria-label="Animated pixel art street with shops, pedestrians and a small unfolding story" role="img"></canvas><div class="scene-label" id="sceneLabel"></div></div>
    <section class="story" aria-live="polite"><div class="story-text"><div class="story-kicker" id="storyKicker"></div><h2 class="story-title" id="storyTitle"></h2><p id="storyBody"></p></div><div class="controls"><button id="dayBtn" type="button">Preview next day →</button><button id="weatherBtn" type="button">Weather: clear</button><button id="timeBtn" type="button">Time: live</button><button id="fullBtn" type="button">Full screen</button></div></section>
    <div class="hint">A little proof of concept · time and story days follow your device · weather is a demo control for now</div>
  </main>
  <script>
  (() => {
    const canvas = document.querySelector('#world'), ctx = canvas.getContext('2d', { alpha: false });
    const W=640,H=360, reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
    const $=id=>document.getElementById(id);
    const dateKey=d=>`${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`;
    const today=new Date(),startKey=localStorage.getItem('littleworld-start')||dateKey(today);
    localStorage.setItem('littleworld-start',startKey);
    const ordinal=key=>{let [y,m,d]=key.split('-').map(Number);return Math.floor(Date.UTC(y,m-1,d)/86400000)};
    let previewOffset=0,day=0,weather=0,timeMode=0,tick=0;
    function syncStoryDay(){day=(Math.max(0,ordinal(dateKey(new Date()))-ordinal(startKey))+previewOffset)%stories.length}
    const stories=[
      ['A very ordinary morning','Mina sets out the flowers. The little brown dog waits beside her stall, as always.'],
      ['Where did Momo go?','Mina has put a handwritten sign by the flowers. Momo is nowhere near his usual spot.'],
      ['A clue by the café','The café owner saw Momo following a delivery bicycle. Mina checks the street each afternoon.'],
      ['Someone comes home','Momo trots back at dusk, muddy and delighted. The café has put a bowl of water outside.'],
      ['The street remembers','Momo is back on his cushion. A few regulars stop to greet him on their way to work.']
    ];
    const people=Array.from({length:18},(_,i)=>({x:(i*79+23)%700-30,y:216+(i%4)*12,dir:i%3?1:-1,speed:.12+(i%5)*.045,shirt:['#b96759','#6c8d9a','#dbad70','#809772','#bf84a1','#9e7890'][i%6],hair:['#3c3341','#674d39','#d4a867','#222c38'][i%4],phase:i*1.8,hat:i%5===0}));
    const clouds=[{x:35,y:25,s:1.2},{x:245,y:47,s:.8},{x:480,y:18,s:1}];
    const palettes={day:{sky:'#86aeb5',far:'#789ba5',building:'#c7896f',cream:'#d1b491',brick:'#9d6670',side:'#e1ba91',road:'#53646b'},night:{sky:'#253852',far:'#405064',building:'#685c72',cream:'#8b7382',brick:'#625369',side:'#796e7c',road:'#283a4b'}};
    function rect(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(Math.round(x),Math.round(y),Math.ceil(w),Math.ceil(h));}
    function line(x,y,w,c){rect(x,y,w,1,c)}
    function text(s,x,y,c='#f6e6bf',size=8){ctx.fillStyle=c;ctx.font=`bold ${size}px monospace`;ctx.textAlign='center';ctx.fillText(s,x,y)}
    function rand(n){let v=Math.sin(n*127.1+13)*43758.5453;return v-Math.floor(v)}
    function drawCloud(x,y,s,c){rect(x+10*s,y,34*s,5*s,c);rect(x,y+5*s,63*s,11*s,c);rect(x+8*s,y-5*s,20*s,7*s,c);rect(x+35*s,y-4*s,17*s,7*s,c)}
    function windowPane(x,y,lit){rect(x,y,13,17,lit?'#efcd82':'#4e6875');rect(x+1,y+1,11,15,lit?'#f8d894':'#66808a');rect(x+6,y,1,17,'#5a4e4d');rect(x,y+8,13,1,'#5a4e4d');if(lit)rect(x+2,y+2,3,3,'#ffe4ab')}
    function awning(x,y,w,a,b){for(let i=0;i<w;i+=8)rect(x+i,y,8,8,(i/8)%2?a:b);rect(x,y+8,w,2,'#695554')}
    function drawBuilding(x,y,w,h,color,trim,night,index){rect(x+3,y-3,w-6,3,trim);rect(x,y,w,h,color);rect(x,y,4,h,trim);rect(x+w-4,y,4,h,trim);for(let row=0;row<2;row++)for(let col=0;col<Math.floor((w-20)/28);col++){let wx=x+13+col*28,wy=y+18+row*31;windowPane(wx,wy,night && (row+col+index)%3!==0);rect(wx-2,wy+18,17,2,trim)}rect(x,y+82,w,3,trim)}
    function drawPerson(p,x,y,t,night){const step=Math.round(Math.sin(t*7+p.phase)*2);rect(x-3,y+13,2,5,'#333c45');rect(x+2,y+13+step,2,5,'#333c45');rect(x-4,y+3,9,11,p.shirt);rect(x-5,y+5,2,8,'#c99c7b');rect(x+5,y+5,2,8,'#c99c7b');rect(x-3,y-5,7,8,'#dfb28b');rect(x-4,y-7,9,4,p.hair);if(p.hat){rect(x-6,y-8,12,2,'#e3b77b');rect(x-3,y-11,7,4,'#e3b77b')}rect(x+(p.dir>0?3:-1),y-2,1,1,'#352d38');if(night)rect(x+7,y+11,2,2,'#ffdf9a')}
    function dog(x,y,t){rect(x-7,y-3,12,7,'#a66e4e');rect(x+3,y-6,6,7,'#ae7852');rect(x+5,y-9,3,5,'#7d513b');rect(x-5,y+4,2,4,'#604b43');rect(x+2,y+4,2,4,'#604b43');rect(x-9,y-6,3,2,'#a66e4e');rect(x+7,y-3,1,1,'#222733');if(Math.sin(t*5)>0)rect(x-11,y-8,3,2,'#a66e4e')}
    function tree(x,y,t,night){rect(x-2,y-26,5,41,'#705248');rect(x-14,y-39,28,15,night?'#466b64':'#668d67');rect(x-18,y-31,36,12,night?'#426360':'#6f9b69');rect(x-10,y-46,21,10,night?'#4c7468':'#7aa574');for(let i=0;i<6;i++)rect(x-12+(i*7)%27,y-40+(i*9)%15,2,2,night?'#709185':'#acc080')}
    function updateText(hour){syncStoryDay();const st=stories[day];$('storyKicker').textContent=`STORY · DAY ${day+1}${previewOffset?' · PREVIEW':''}`;$('storyTitle').textContent=st[0];$('storyBody').textContent=st[1];$('sceneLabel').textContent=`${hour<5?'SLEEPING CITY':hour<7?'EARLY MORNING':hour<11?'MORNING':hour<17?'AFTERNOON':hour<20?'EVENING':'NIGHT'}  ·  ${weather?'RAIN':'CLEAR'}  ·  DAY ${day+1}`;$('weatherBtn').textContent='Weather: '+(weather?'rain':'clear');$('timeBtn').textContent='Time: '+(['live','morning','dusk','night'][timeMode]);}
    function draw(now){let date=new Date(),hour=[date.getHours()+date.getMinutes()/60,9,18.5,22][timeMode],night=hour<6||hour>=19.5, dusk=hour>=17.2&&hour<19.5,p=night?palettes.night:palettes.day;tIck(now); const t=tick;
      rect(0,0,W,H,p.sky);if(dusk)rect(0,100,W,90,'#b68179');
      if(night){rect(480,20,15,15,'#eedca9');for(let i=0;i<30;i++)rect(rand(i+1)*W,rand(i+89)*90,1,1,'#d4cfb6')}else{rect(475,25,20,20,'#f4e2b1');rect(480,20,10,30,'#f4e2b1');clouds.forEach((c,i)=>drawCloud(((c.x+t*(i%2?1.1:.55))%760)-70,c.y,c.s,'#d9e4cf'))}
      for(let i=0;i<11;i++){let x=i*64-7,h=42+rand(i+90)*42;rect(x,128-h,59,h,p.far);for(let j=0;j<5;j++)rect(x+8+j*10,144-h+rand(i*5+j)*18,3,6,night?'#b2a988':'#789fa2')}
      rect(0,178,W,110,p.side);
      drawBuilding(0,79,155,151,p.brick,'#74545d',night,0);drawBuilding(156,65,133,165,p.cream,'#98795f',night,1);drawBuilding(291,83,175,147,p.building,'#9b695e',night,2);drawBuilding(468,72,172,158,p.cream,'#947363',night,3);
      for(let i=0;i<18;i++){let x=11+i*35;rect(x,91+(i%3)*2,4,2,'#f0d5a5')}
      rect(10,176,137,54,'#394b54');rect(17,181,122,46,night?'#b1967e':'#8fa6a1');rect(61,180,2,48,'#465159');rect(21,207,115,2,'#465159');awning(8,166,140,'#b96061','#f5d8a5');rect(28,184,68,5,'#e1b38a');text('PETITE BOULANGERIE',79,194,night?'#fae5a5':'#f5e3c3',7);
      rect(170,176,102,54,'#6b5362');rect(174,181,94,46,night?'#dbb77e':'#aaa68f');rect(207,181,2,46,'#655456');awning(168,165,105,'#647d78','#e8c79f');text('CAFÉ LUNE',222,195,'#f5e9cf',9);rect(178,211,87,3,'#78665a');
      rect(302,179,151,51,'#374b55');rect(309,184,137,42,night?'#e4bd89':'#9fb19e');rect(360,184,2,41,'#4c5960');awning(300,168,155,'#bd735e','#eacb9c');text('FLEURS DE MINA',378,196,'#f8e5cb',9);
      rect(480,179,147,51,'#43545a');rect(486,184,135,43,night?'#c7a77f':'#8da2a0');awning(479,166,149,'#717f8d','#e8cda6');text('LE PETIT MARCHÉ',553,194,'#efe5cf',8);
      for(let i=0;i<13;i++){let x=10+i*52;rect(x,233,49,1,'#c6a486');rect(x+48,239,2,25,'#b79478')}rect(0,267,W,2,'#ede0b1');rect(0,270,W,90,p.road);rect(0,280,W,1,'#415766');for(let i=0;i<11;i++)rect(i*66+10,326,34,2,'#c6bc9e');
      const traffic=hour<5?0:hour<7?1:hour<20?3:hour<23?2:1;
      for(let i=0;i<traffic;i++){let x=(i*277+60+t*(i%2?15:-11))%850-100,y=293+(i%2)*29;rect(x,y,47,13,['#ad6970','#5e8992','#b48c67'][i]);rect(x+8,y-7,27,9,['#bd8181','#7ea2a7','#cfaa78'][i]);rect(x+11,y-5,20,6,'#7394a0');rect(x+6,y+12,8,5,'#323743');rect(x+34,y+12,8,5,'#323743');rect(x+(i%2?46:0),y+6,2,3,'#edcc9d')}
      tree(281,233,t,night);tree(614,229,t,night);
      rect(305,230,29,3,'#706051');rect(308,233,2,12,'#706051');rect(330,233,2,12,'#706051');rect(478,238,43,3,'#7e6454');rect(484,241,2,12,'#7e6454');rect(516,241,2,12,'#7e6454');
      for(let i=0;i<4;i++){let x=330+i*26;rect(x,223,12,9,'#77685a');rect(x+1,216,10,9,['#d67d8c','#eeb18b','#b783ad','#f3d4a8'][i]);rect(x+5,212,3,5,'#61936b');rect(x+8,213,4,4,'#709b73')}
      if(day===1||day===2){rect(397,200,16,17,'#eadfba');rect(400,204,10,2,'#915e58');rect(401,209,8,1,'#915e58');rect(401,213,8,1,'#915e58')}
      const walkers=hour<5?0:hour<7?2:hour<9?14:hour<16?11:hour<19?18:hour<22?7:2;
      people.forEach((person,i)=>{if(i>=walkers)return;const x=(person.x+t*person.speed*person.dir*20+9000)%760-60;drawPerson(person,x,person.y+Math.sin(t*4+i)*.7,t,night)});
      if(hour>=7&&hour<20)drawPerson({shirt:'#b66264',hair:'#403642',dir:1,phase:0,hat:false},352,218,t,night);
      if(hour>=6&&hour<21&&day!==1&&day!==2)dog(day===3?373:400,244,t);
      // These are ordinary closed storefronts at night, even while the world keeps running.
      if(hour<7||hour>=18){rect(10,178,137,51,'#626873');for(let y=182;y<229;y+=5)line(12,y,133,'#889095')}
      if(hour<7||hour>=20){rect(302,179,151,50,'#656f72');for(let y=183;y<229;y+=5)line(304,y,147,'#919995')}
      if(hour<6||hour>=22){rect(170,177,102,52,'#59656c');for(let y=181;y<229;y+=5)line(172,y,98,'#7f8c8c')}
      if(hour<8||hour>=21){rect(480,179,147,51,'#647077');for(let y=183;y<229;y+=5)line(482,y,143,'#909b9a')}
      if(night){for(const x of [155,463,628]){rect(x,172,2,69,'#343a44');rect(x-7,167,16,6,'#ecce8f');rect(x-15,173,32,1,'#d0a66e')}}
      if(weather){rect(0,0,W,H,'#28435a33');for(let i=0;i<145;i++){let x=(rand(i+12)*W+t*(i%3+1)*-11)%W,y=(rand(i+555)*H+t*(i%4+2)*65)%H;rect(x,y,1,5,'#bfdae0a8')}for(let i=0;i<8;i++){let x=i*91+18;rect(x,263,27,1,'#8ba9aa');rect(x+8,264,12,1,'#91b6b4')}}
      if(!reduced)requestAnimationFrame(draw)
    }
    let last=0;function tIck(now){if(!last)last=now;tick+=Math.min((now-last)/1000,.05);last=now}
    $('dayBtn').onclick=()=>{previewOffset=(previewOffset+1)%stories.length;updateText([new Date().getHours(),9,18.5,22][timeMode]);if(reduced)draw(performance.now())};
    $('weatherBtn').onclick=()=>{weather=1-weather;updateText([new Date().getHours(),9,18.5,22][timeMode]);if(reduced)draw(performance.now())};
    $('timeBtn').onclick=()=>{timeMode=(timeMode+1)%4;updateText([new Date().getHours(),9,18.5,22][timeMode]);if(reduced)draw(performance.now())};
    $('fullBtn').onclick=()=>{const el=document.querySelector('.frame');if(!document.fullscreenElement)el.requestFullscreen?.();else document.exitFullscreen?.()};
    function clock(){let d=new Date();$('clock').textContent=d.toLocaleString(undefined,{weekday:'short',hour:'numeric',minute:'2-digit'});updateText([d.getHours(),9,18.5,22][timeMode])}clock();setInterval(clock,60000);requestAnimationFrame(draw);
  })();
  </script>
</body>
</html>
